plugins {
    id 'com.android.application'
}

android {
    namespace 'com.inicio.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.inicio.tv'
        minSdk 25
        targetSdk 28
        versionCode 30
        versionName '1.29'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
